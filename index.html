<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>機器人與機關王雙大賽培訓 | 招潮蟹老師</title>
  <style>
    /* ===== 基礎設定與重置 ===== */
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.5);
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html {
      scroll-behavior: smooth;
      font-family: 'PingFang TC', '微軟正黑體', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      overflow-x: hidden;
      scroll-padding-top: 80px;
    }

    body { position: relative; }

    /* ===== 背景 Canvas ===== */
    #bg-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: -1;
      background: linear-gradient(135deg, #0f172a, #1e293b);
    }

    /* ===== 導覽列 (Sticky Navbar) ===== */
    nav {
      position: fixed;
      top: 0; width: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 5%;
      z-index: 100;
    }
    nav .logo { font-size: 1.1rem; font-weight: bold; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
    nav .logo span { font-size: 0.8rem; background: rgba(255,255,255,0.1); padding: 3px 8px; border-radius: 4px; color: var(--text-muted); }
    nav .links a {
      color: var(--text-main);
      text-decoration: none;
      margin-left: 20px;
      font-size: 0.95rem;
      transition: color 0.3s;
    }
    nav .links a:hover { color: var(--accent); }

    /* ===== 首屏 Hero Section ===== */
    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 20px;
      position: relative;
    }
    .hero-badge {
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      padding: 6px 16px;
      border-radius: 30px;
      font-size: 0.9rem;
      margin-bottom: 20px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      letter-spacing: 1px;
    }
    .hero h1 {
      font-size: 3.5rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 20px;
      text-shadow: 0 0 20px var(--accent-glow);
    }
    .hero p {
      font-size: 1.2rem;
      color: var(--text-muted);
      max-width: 650px;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    
    /* ===== 按鈕設計 (新加入) ===== */
    .btn {
      display: inline-block;
      background: var(--accent);
      color: #0f172a;
      padding: 12px 30px;
      border-radius: 30px;
      font-weight: bold;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
      z-index: 10;
    }
    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px var(--accent-glow);
    }
    .btn:active {
      transform: scale(0.95);
      box-shadow: 0 0 5px var(--accent);
      background: #0ea5e9;
    }

    .hero-watermark {
      position: absolute;
      font-size: 12vw;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.02);
      z-index: -1;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
    }
    .scroll-indicator {
      position: absolute;
      bottom: 40px;
      font-size: 0.8rem;
      letter-spacing: 2px;
      animation: bounce 2s infinite;
      color: var(--text-muted);
    }
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-10px); }
      60% { transform: translateY(-5px); }
    }

    /* ===== 共用區塊與浮水印數字 ===== */
    section {
      padding: 100px 5%;
      max-width: 1100px;
      margin: 0 auto;
      position: relative;
    }
    .section-number {
      position: absolute;
      top: 50px;
      left: 0;
      font-size: 8rem;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.03);
      line-height: 1;
      z-index: -1;
    }
    .section-title { font-size: 2.2rem; font-weight: 700; margin-bottom: 10px; }
    .section-subtitle { color: var(--accent); font-size: 1rem; margin-bottom: 40px; letter-spacing: 1px; }
